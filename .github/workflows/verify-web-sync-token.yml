name: Verify Web Sync Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify ZHIPEI_ONE_PAT can write to Web repository
        env:
          SYNC_PAT: ${{ secrets.ZHIPEI_ONE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_PAT:-}" ]; then
            echo "::error::ZHIPEI_ONE_PAT is missing or empty"
            exit 1
          fi
          response="$(curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${SYNC_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tianbops/zhipei-one/git/blobs \
            -d '{"content":"zhipei-one PAT permission verification","encoding":"utf-8"}')"
          sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<< "$response")"
          if [ -z "$sha" ]; then
            echo "::error::GitHub did not return a blob SHA"
            exit 1
          fi
          echo "PASS: ZHIPEI_ONE_PAT authenticated and has contents:write on tianbops/zhipei-one."
          echo "Verification blob created without changing any branch, file, release, or deployment."
