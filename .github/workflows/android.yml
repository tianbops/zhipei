name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      web_url:
        description: '线上 web 地址（留空用仓库默认配置）'
        required: false
      version_name:
        description: '版本号，例如 1.0.0'
        required: false
        default: '1.0.0'
      build_type:
        description: '构建类型'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

jobs:
  build:
    runs-on: ubuntu-latest
    # 默认 GITHUB_TOKEN 只有读权限，创建 Release 会报
    # "Resource not accessible by integration"，这里显式放开 contents 写权限
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本
        id: ver
        env:
          REQUESTED_VERSION_NAME: ${{ github.event.inputs.version_name }}
        shell: bash
        run: |
          if [ -n "$REQUESTED_VERSION_NAME" ]; then
            NAME="$REQUESTED_VERSION_NAME"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.0"
          fi
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式无效，仅允许 SemVer 数字、点、加号和连字符"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Keep versionCode monotonic and aligned with scripts/sync-version.sh.
          # Strip SemVer prerelease/build metadata before calculating the numeric code.
          CORE="${NAME%%[-+]*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          CODE=$(( (10#$MAJOR * 100 + 10#$MINOR) * 100 + 10#$PATCH ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Capacitor 7 的 capacitor-android 模块要求 Java 21，用 17 会报
      # "error: invalid source release: 21"
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不要用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 新版 cmdline-tools 已移除 tools 包，直接报 "Failed to find package 'tools'" 退出。
      # ubuntu-latest 镜像自带 SDK（ANDROID_HOME=/usr/local/lib/android/sdk），够用。

      - name: 安装依赖
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm.log

      - name: 指定线上地址
        if: ${{ github.event.inputs.web_url != '' }}
        env:
          WEB_URL: ${{ github.event.inputs.web_url }}
        shell: bash
        run: |
          node -e "
            const fs=require('fs');const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            const url=process.env.WEB_URL;
            const parsed=new URL(url);
            if (parsed.protocol !== 'https:' || !parsed.hostname) throw new Error('web_url 必须是有效的 HTTPS 地址');
            c.server={...(c.server||{}),url,androidScheme:'https'};
            fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n');
          "

      - name: 同步 Capacitor
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npx cap sync android 2>&1 | tee ci-logs/cap-sync.log

      - name: 写入版本号
        shell: bash
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle

      # 注意：secrets 上下文不能出现在 if 条件里（会导致整个 workflow 编译失败、一个 job 都起不来），
      # 只能通过 env 传进来，在脚本内部判断是否配置。
      - name: Require signing credentials for release
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::正式 Release 缺少签名 Secrets：%s\n' "${missing[*]}"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >/tmp/zhipei-release-check.jks
          trap 'rm -f /tmp/zhipei-release-check.jks' EXIT
          keytool -list -keystore /tmp/zhipei-release-check.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore 与指定 alias 可读取；key password 将由正式 Gradle Release 构建验证"

      - name: 准备签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Debug 构建无需签名密钥"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zhipei.jks
          # 必须用绝对路径：android.injected.signing.store.file 的相对路径是相对
          # 模块目录 android/app 解析的，写 app/zhipei.jks 会去找 android/app/app/zhipei.jks
          KS="$GITHUB_WORKSPACE/android/app/zhipei.jks"
          ls -l "$KS"
          echo "签名 keystore 已准备就绪"

      # 在 Windows 上提交的 gradlew 会丢掉可执行位（core.fileMode 默认 false），
      # 到 Linux runner 上就是 Permission denied，这里显式补回来。
      - name: 修复 gradlew 权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 构建 Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/zhipei.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-debug.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-release.apk 2>/dev/null || true
          ls -la dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhipei-one-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: 挂到 Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          name: 智配One V${{ steps.ver.outputs.name }}
          files: dist/*.apk

  

  

  

  # ── 下载页自动同步 ──────────────────────────────────────────────
  # 打 tag 出 Release 后，把 release APK 自动镜像到 zhipei-one 的 downloads/，
  # 并更新 manifest.json 与 version.json（version.json = tag 号）。
  # 这是「git tag 为唯一版本真值源」的关键：发版后关于页版本号与下载的 APK
  # 永远一致，不再有人工改 version.json、不再版本漂移。
  # 此外会在 zhipei-one 仓库建一个同 tag 的发行版，使 GitHub 首页 Latest 显示
  # 真实当前版本（而非陈旧历史 tag）。
  # 提交会触发 Cloudflare Pages 重新部署。内容无变化时跳过文件提交，避免空部署。
  # 依赖 repo secret：ZHIPEI_ONE_PAT（对 zhipei-one 有 contents:write 的 PAT）。
  sync-download:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 镜像 APK + manifest + version 到 zhipei-one
        env:
          SYNC_PAT: ${{ secrets.ZHIPEI_ONE_PAT }}
        shell: bash
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::warning::未配置 ZHIPEI_ONE_PAT secret，跳过下载页同步"
            exit 0
          fi
          export TZ=Asia/Shanghai
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request, urllib.error, urllib.parse, datetime
          PAT = os.environ["SYNC_PAT"]
          TAG = os.environ["GITHUB_REF_NAME"]
          VER = TAG[1:]
          SRC, DST = "tianbops/zhipei", "tianbops/zhipei-one"
          DRY = os.environ.get("SYNC_DRY") == "1"

          def api(url, method="GET", payload=None, raw=False):
              data = json.dumps(payload).encode() if payload is not None else None
              # raw=True 时下载 release 资产二进制，必须用 octet-stream，
              # 否则 GitHub 返回资产元数据 JSON（约 1-2KB）而非 APK 本体
              headers = {"Authorization": "Bearer " + PAT,
                         "Content-Type": "application/json",
                         "Accept": "application/octet-stream" if raw else "application/vnd.github+json"}
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=180) as r:
                  b = r.read()
                  return b if raw else (json.loads(b) if b.strip() else {})

          def ensure_release(tag, ver):
              # 先查后建，幂等；即使 Release 已存在，也继续核对并补齐 APK 附件
              rel_url = "https://api.github.com/repos/%s/releases/tags/%s" % (DST, tag)
              try:
                  return api(rel_url)
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              if DRY:
                  print("DRY-RUN：不创建 zhipei-one release %s" % tag)
                  return None
              body = ("自动发布：与 tianbops/zhipei 的 %s 发行版同步。\\n\\n"
                      "Web 版本号（version.json）与下载 APK 均为 %s，二者一致。"
                      % (tag, ver))
              release = api("https://api.github.com/repos/%s/releases" % DST, "POST",
                            {"tag_name": tag, "name": "智配One V" + VER, "body": body,
                             "target_commitish": "main", "draft": False, "prerelease": False})
              print("已创建 zhipei-one release %s" % tag)
              return release

          def sync_release_asset(tag, ver, apk):
              release = ensure_release(tag, ver)
              if release is None:
                  print("DRY-RUN：跳过 Release APK 附件上传")
                  return
              asset_name = "zhipei-one-%s-release.apk" % ver
              existing = next((a for a in release.get("assets", []) if a["name"] == asset_name), None)
              if existing and existing.get("size") == len(apk):
                  print("Release 附件已存在且大小一致，跳过上传：%s" % asset_name)
                  return
              if DRY:
                  print("DRY-RUN：将上传 Release 附件 %s（%d bytes）" % (asset_name, len(apk)))
                  return
              if existing:
                  api("https://api.github.com/repos/%s/releases/assets/%s" % (DST, existing["id"]), "DELETE")
                  print("已删除大小不一致的旧附件：%s" % asset_name)
              upload_url = release["upload_url"].split("{", 1)[0]
              req = urllib.request.Request(
                  upload_url + "?name=" + urllib.parse.quote(asset_name),
                  data=apk,
                  method="POST",
                  headers={"Authorization": "Bearer " + PAT,
                           "Content-Type": "application/vnd.android.package-archive",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=180) as response:
                  uploaded = json.loads(response.read())
              if uploaded.get("name") != asset_name or uploaded.get("size") != len(apk):
                  raise RuntimeError("Release 附件上传后校验失败")
              print("已上传 Release APK 附件：%s（%d bytes）" % (asset_name, len(apk)))

          rel = api("https://api.github.com/repos/%s/releases/tags/%s" % (SRC, TAG))
          asset = next((a for a in rel.get("assets", [])
                        if a["name"] == "zhipei-one-%s-release.apk" % VER), None)
          if not asset:
              print("::warning::%s 下没有 zhipei-one-%s-release.apk，跳过同步" % (TAG, VER))
              raise SystemExit(0)
          apk = api("https://api.github.com/repos/%s/releases/assets/%s" % (SRC, asset["id"]), raw=True)
          md5 = hashlib.md5(apk).hexdigest()
          print("APK bytes=%d md5=%s" % (len(apk), md5))

          def new_blob(content, b64=False):
              body = {"content": base64.b64encode(content).decode() if b64 else content.decode("utf-8"),
                      "encoding": "base64" if b64 else "utf-8"}
              return api("https://api.github.com/repos/%s/git/blobs" % DST, "POST", body)["sha"]

          apk_sha = new_blob(apk, b64=True)
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d")
          manifest = (json.dumps({
              "version": VER,
              "file": "zhipei-one-latest-release.apk",
              "size": len(apk),
              "updated": today,
              "note": "发新版时：替换同目录 latest APK + 更新 version/updated，页面无需改动",
          }, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          mf_sha = new_blob(manifest)
          # 关于页版本号 = tag 号（git tag 为唯一真值源）。web-only 改动不发新 APK，
          # 此时 tag 不变、APK 不变，此文件 sha 不变 → 本次会被跳过，版本号保持不动。
          vers = (json.dumps({"version": VER, "updated": today}, ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          vers_sha = new_blob(vers)

          head = api("https://api.github.com/repos/%s/git/ref/heads/main" % DST)["object"]["sha"]
          files = [("downloads/zhipei-one-latest-release.apk", apk_sha),
                   ("downloads/manifest.json", mf_sha),
                   ("version.json", vers_sha)]
          changed = []
          for path, sha in files:
              try:
                  cur = api("https://api.github.com/repos/%s/contents/%s?ref=main" % (DST, path))
                  same = (cur.get("sha") == sha)
              except Exception:
                  same = False
              if not same:
                  changed.append(path)
          if not changed:
              print("文件内容无变化，跳过提交")
          else:
              print("待更新:", changed)
              if DRY:
                  print("DRY-RUN：不提交")
              else:
                  tree = [{"path": p, "mode": "100644", "type": "blob", "sha": s} for p, s in files]
                  t = api("https://api.github.com/repos/%s/git/trees" % DST, "POST",
                          {"base_tree": head, "tree": tree})
                  c = api("https://api.github.com/repos/%s/git/commits" % DST, "POST",
                          {"message": "chore(release): 同步 %s 到下载页 + version.json + 发行版\n\n来自 %s release %s（size=%d, md5=%s）"
                              % (TAG, SRC, TAG, len(apk), md5[:8]),
                           "tree": t["sha"], "parents": [head]})
                  api("https://api.github.com/repos/%s/git/refs/heads/main" % DST, "PATCH",
                      {"sha": c["sha"], "force": False})
                  print("已同步 -> %s (%s)" % (DST, c["sha"][:10]))
          # 无论 Release 是否已存在，都确保有对应版本的 APK 附件
          sync_release_asset(TAG, VER, apk)
          PY
