name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      web_url:
        description: '线上 web 地址（留空用仓库默认配置）'
        required: false
      version_name:
        description: '版本号，例如 1.0.0'
        required: false
        default: '1.0.0'
      build_type:
        description: '构建类型'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            NAME="${{ inputs.version_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.0"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm ci

      - name: 指定线上地址
        if: ${{ inputs.web_url != '' }}
        shell: bash
        run: |
          node -e "
            const fs=require('fs');const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.server={...(c.server||{}),url:'${{ inputs.web_url }}',androidScheme:'https'};
            fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          "

      - name: 同步 Capacitor
        run: npx cap sync android

      - name: 写入版本号
        shell: bash
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle

      - name: 准备签名
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/zhipei.jks
          echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=app/zhipei.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: 构建 Debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 构建 Release APK
        if: ${{ inputs.build_type != 'debug' }}
        run: cd android && ./gradlew assembleRelease --no-daemon ${{ env.SIGN_ARGS }}

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-debug.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-release.apk 2>/dev/null || true
          ls -la dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhipei-one-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: warn

      - name: 挂到 Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
