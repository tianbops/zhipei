name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      web_url:
        description: '线上 web 地址（留空用仓库默认配置）'
        required: false
      version_name:
        description: '版本号，例如 1.0.0'
        required: false
        default: '1.0.0'
      build_type:
        description: '构建类型'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

jobs:
  build:
    runs-on: ubuntu-latest
    # 默认 GITHUB_TOKEN 只有读权限，创建 Release 会报
    # "Resource not accessible by integration"，这里显式放开 contents 写权限
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.0"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Capacitor 7 的 capacitor-android 模块要求 Java 21，用 17 会报
      # "error: invalid source release: 21"
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不要用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 新版 cmdline-tools 已移除 tools 包，直接报 "Failed to find package 'tools'" 退出。
      # ubuntu-latest 镜像自带 SDK（ANDROID_HOME=/usr/local/lib/android/sdk），够用。

      - name: 安装依赖
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm.log

      - name: 指定线上地址
        if: ${{ github.event.inputs.web_url != '' }}
        shell: bash
        run: |
          node -e "
            const fs=require('fs');const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.server={...(c.server||{}),url:'${{ github.event.inputs.web_url }}',androidScheme:'https'};
            fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          "

      - name: 同步 Capacitor
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npx cap sync android 2>&1 | tee ci-logs/cap-sync.log

      - name: 写入版本号
        shell: bash
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle

      # 注意：secrets 上下文不能出现在 if 条件里（会导致整个 workflow 编译失败、一个 job 都起不来），
      # 只能通过 env 传进来，在脚本内部判断是否配置。
      - name: 准备签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，release 将产出未签名包"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zhipei.jks
          echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=app/zhipei.jks -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "签名密钥已就绪"

      # 在 Windows 上提交的 gradlew 会丢掉可执行位（core.fileMode 默认 false），
      # 到 Linux runner 上就是 Permission denied，这里显式补回来。
      - name: 修复 gradlew 权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 构建 Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: cd android && ./gradlew assembleRelease --no-daemon ${{ env.SIGN_ARGS }}

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-debug.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-release.apk 2>/dev/null || true
          ls -la dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhipei-one-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: warn

      - name: 挂到 Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
