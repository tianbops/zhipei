name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      web_url:
        description: '线上 web 地址（留空用仓库默认配置）'
        required: false
      version_name:
        description: '版本号，例如 1.0.0'
        required: false
        default: '1.0.0'
      build_type:
        description: '构建类型'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.0"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不要用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 新版 cmdline-tools 已移除 tools 包，直接报 "Failed to find package 'tools'" 退出。
      # ubuntu-latest 镜像自带 SDK（ANDROID_HOME=/usr/local/lib/android/sdk），够用。

      - name: 安装依赖
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/npm.log

      - name: 指定线上地址
        if: ${{ github.event.inputs.web_url != '' }}
        shell: bash
        run: |
          node -e "
            const fs=require('fs');const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.server={...(c.server||{}),url:'${{ github.event.inputs.web_url }}',androidScheme:'https'};
            fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          "

      - name: 同步 Capacitor
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npx cap sync android 2>&1 | tee ci-logs/cap-sync.log

      - name: 写入版本号
        shell: bash
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.name }}\"/" android/app/build.gradle

      - name: 准备签名
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/zhipei.jks
          echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=app/zhipei.jks -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: 构建 Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../ci-logs/gradle-debug.log

      - name: 构建 Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cd android
          ./gradlew assembleRelease --no-daemon ${{ env.SIGN_ARGS }} 2>&1 | tee ../ci-logs/gradle-release.log

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-debug.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk dist/zhipei-one-${{ steps.ver.outputs.name }}-release.apk 2>/dev/null || true
          ls -la dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zhipei-one-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: warn

      - name: 挂到 Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

      - name: 导出构建日志
        if: always()
        run: |
          mkdir -p ci-logs
          { echo "run=${{ github.run_number }}"; echo "sha=${{ github.sha }}"; echo "java=$(java -version 2>&1 | head -1)"; echo "ANDROID_HOME=$ANDROID_HOME"; ls -la android/app/src/main/res/values/ android/app/src/main/res/drawable/ 2>/dev/null; } > ci-logs/env.txt 2>&1 || true
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B ci-logs || git checkout -q ci-logs
          git add -f ci-logs
          git commit -q -m "ci: 构建日志 run ${{ github.run_number }}" || echo "无新增日志"
          git push -q -f origin ci-logs || echo "推送日志分支失败"
          echo "日志已推送到 ci-logs 分支"
