name: Android Build Check (no release)

# 常规代码提交 / PR 的构建护栏：只验证能否成功构建 Debug APK，
# 不发布 Release、不上传产物、不触发 sync-download。
# 正式发版仍由 android.yml（仅 tag / 手动触发）负责，二者职责分离。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Capacitor 7 的 capacitor-android 要求 Java 21
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装依赖
        run: npm ci

      # 桥接契约护栏：原生方法改名/改签名时立即失败，而不是让网页端静默降级
      - name: 校验桥接契约
        run: npm run check:bridge

      - name: 同步 Capacitor 平台
        run: npx cap sync android

      # Windows 提交会丢掉 gradlew 可执行位，到 Linux runner 需补回
      - name: 修复 gradlew 权限
        run: chmod +x android/gradlew

      # 仅校验可构建；不签名、不产出 release 包
      - name: 构建 Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
