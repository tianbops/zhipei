name: Android build verification

# 本工作流是**唯一**的常规构建护栏（push/PR → main）。
# 2026-10-30 合并了此前的 android-build-check.yml：两者触发条件完全相同
# （push + pull_request → main），步骤是严格的包含关系，每次提交都跑两遍
# debug 构建等于双倍 CI 分钟数。合并后保留全部更严格的步骤：
#   依赖审计 / 桥接契约 / 模板漂移 / Debug 构建（均为阻塞项）
#   + Android 模拟器主题切换仪器测试与应用启动冒烟（阻塞验收）
# 正式发版仍由 android.yml（仅 tag v* / 手动）负责，职责不变。
# 注意：main 分支保护要求本 job 的检查名 `android-debug-build`，改名须同步改保护规则。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 版本一致性检查要读最新 vX.Y.Z tag；浅克隆会让它静默跳过。
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      # ── 依赖审计门禁（审计报告 P0-2）────────────────────────────
      # 本仓跟踪 package-lock.json，可直接审计；--audit-level=high 只阻断
      # High/Critical，Low/Moderate 只记录。Gradle 侧依赖不在 npm 覆盖范围内，
      # 由 dependabot 的 gradle ecosystem 做版本跟踪（见 .github/dependabot.yml）。
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Check native bridge contract
        run: npm run check:bridge
      - name: Check native template drift
        # android-template/ 是 README 定义的原生真值源，漂移会让"用模板覆盖 android/"
        # 静默丢掉已注册的 @JavascriptInterface 桥接能力（2026-10-28 发现时已丢 6 个）
        run: npm run check:template-drift
      - name: Check back-key channel contract
        # ADR 0003：返回键必须交 window.zpSystemBack，不得以 webView.goBack() 作第一分支——
        # goBack 只认「上一页文档」，会把页面内开着的确认框/抽屉连同未处理内容一起丢掉
        run: npm run check:back
      - name: Check launch-screen handshake
        # 启动屏必须继承 Theme.SplashScreen 并按 setKeepOnScreenCondition 等网页首帧，
        # 否则会退回「窗口首帧即退出」——远程首屏尚未绘制，用户会看到 1~2 秒空窗
        run: npm run check:launch
      - name: Check version consistency (advisory)
        # 2026-11-03 体检：tag v1.0.29 时 build.gradle 仍写 1.0.22。构建期由 android.yml
        # 用 sed 注入、不提交，而 main 要求 PR，自动化无法回写 —— 故这里只告警不判红，
        # 发版前用 `npm run check:version -- --strict` 硬把关（见 AGENTS 发布检查单）。
        run: npm run check:version
      - name: Check native popup theme synchronization
        # Web 深浅主题独立于系统外观，WebView 原生选择/日期弹层必须同步宿主 AppCompat uiMode。
        run: npm run check:theme
      - name: Check status-bar recolor timing
        # 真机逐帧实测：网页换色后 WebView 要 1 帧才合成上屏，而原生立即换色会在屏幕上
        # 留下「状态栏先变、页面后变」的错色带。applyTheme 必须 postOnAnimation 对齐，
        # 并保留 WebView 未挂载时的立即执行兜底。
        run: npm run check:statusbar
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew
      - name: Build debug APK (verification only)
        run: cd android && ./gradlew assembleDebug --no-daemon

      # Linux emulator must use KVM. Without this permission it silently falls back
      # to software emulation; the last CI boot took 473 seconds.
      - name: Enable and verify KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run Android theme-switch instrumentation test
        # 冷启动模拟器后再执行仪器测试；保留足够诊断窗口并在失败时输出 logcat。
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            set -eu; cd "$GITHUB_WORKSPACE/android"; set +e; timeout 10m ./gradlew connectedDebugAndroidTest --no-daemon --console=plain --info --stacktrace; test_status=$?; set -e; if [ "$test_status" -ne 0 ]; then echo "::error::Android instrumentation test failed or exceeded its 10-minute diagnostic limit (exit $test_status)"; adb logcat -d -t 10000 | tail -n 500; exit "$test_status"; fi; cd "$GITHUB_WORKSPACE"; adb install -r android/app/build/outputs/apk/debug/app-debug.apk; adb shell monkey -p com.tianbops.zhipei 1; for attempt in $(seq 1 30); do if adb shell pidof com.tianbops.zhipei >/dev/null 2>&1; then break; fi; sleep 2; done; adb shell pidof com.tianbops.zhipei >/dev/null; sleep 10; if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Process: com.tianbops.zhipei, PID:"; then echo "::error::Android app crashed during emulator startup"; exit 1; fi
