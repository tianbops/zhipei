name: Android build verification

# 本工作流是**唯一**的常规构建护栏（push/PR → main）。
# 2026-10-30 合并了此前的 android-build-check.yml：两者触发条件完全相同
# （push + pull_request → main），步骤是严格的包含关系，每次提交都跑两遍
# debug 构建等于双倍 CI 分钟数。合并后保留全部更严格的步骤：
#   依赖审计 / 桥接契约 / 模板漂移 / Debug 构建（均为阻塞项）
#   + 模拟器启动冒烟（continue-on-error，非阻塞）
# 正式发版仍由 android.yml（仅 tag v* / 手动）负责，职责不变。
# 注意：main 分支保护要求本 job 的检查名 `android-debug-build`，改名须同步改保护规则。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      # ── 依赖审计门禁（审计报告 P0-2）────────────────────────────
      # 本仓跟踪 package-lock.json，可直接审计；--audit-level=high 只阻断
      # High/Critical，Low/Moderate 只记录。Gradle 侧依赖不在 npm 覆盖范围内，
      # 由 dependabot 的 gradle ecosystem 做版本跟踪（见 .github/dependabot.yml）。
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Check native bridge contract
        run: npm run check:bridge
      - name: Check native template drift
        # android-template/ 是 README 定义的原生真值源，漂移会让"用模板覆盖 android/"
        # 静默丢掉已注册的 @JavascriptInterface 桥接能力（2026-10-28 发现时已丢 6 个）
        run: npm run check:template-drift
      - name: Check back-key channel contract
        # ADR 0003：返回键必须交 window.zpSystemBack，不得以 webView.goBack() 作第一分支——
        # goBack 只认「上一页文档」，会把页面内开着的确认框/抽屉连同未处理内容一起丢掉
        run: npm run check:back
      - name: Check launch-screen handshake
        # 启动屏必须继承 Theme.SplashScreen 并按 setKeepOnScreenCondition 等网页首帧，
        # 否则会退回「窗口首帧即退出」——远程首屏尚未绘制，用户会看到 1~2 秒空窗
        run: npm run check:launch
      - name: Check native popup theme synchronization
        # Web 深浅主题独立于系统外观，WebView 原生选择/日期弹层必须同步宿主 AppCompat uiMode。
        run: npm run check:theme
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew
      - name: Build debug APK (verification only)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Launch app in Android Emulator (non-blocking)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -eu; adb install -r android/app/build/outputs/apk/debug/app-debug.apk; adb shell monkey -p com.tianbops.zhipei 1; for attempt in $(seq 1 30); do if adb shell pidof com.tianbops.zhipei >/dev/null 2>&1; then break; fi; sleep 2; done; adb shell pidof com.tianbops.zhipei >/dev/null; sleep 10; if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Process: com.tianbops.zhipei, PID:"; then echo "::error::Android app crashed during emulator startup"; exit 1; fi
