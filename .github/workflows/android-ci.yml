name: Android build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew
      - name: Build debug APK (verification only)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Launch app in Android Emulator (non-blocking)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -eu; adb install -r android/app/build/outputs/apk/debug/app-debug.apk; adb shell monkey -p com.tianbops.zhipei 1; for attempt in $(seq 1 30); do if adb shell pidof com.tianbops.zhipei >/dev/null 2>&1; then break; fi; sleep 2; done; adb shell pidof com.tianbops.zhipei >/dev/null; sleep 10; if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Process: com.tianbops.zhipei, PID:"; then echo "::error::Android app crashed during emulator startup"; exit 1; fi
