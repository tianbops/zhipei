name: Android build verification

# 本工作流是**唯一**的常规构建护栏（push/PR → main）。
# 依赖审计 / 桥接契约 / 模板漂移 / Debug 构建为阻塞项；
# 模拟器仪器测试与启动冒烟同样作为阻塞验证。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Check native bridge contract
        run: npm run check:bridge
      - name: Check native template drift
        run: npm run check:template-drift
      - name: Check back-key channel contract
        run: npm run check:back
      - name: Check launch-screen handshake
        run: npm run check:launch
      - name: Check native popup theme synchronization
        run: npm run check:theme
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew
      - name: Build debug APK (verification only)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Run Android theme-switch instrumentation test
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -eu
            cd android
            ./gradlew connectedDebugAndroidTest --no-daemon
            cd ..
            adb shell monkey -p com.tianbops.zhipei 1
            for attempt in $(seq 1 30); do
              if adb shell pidof com.tianbops.zhipei >/dev/null 2>&1; then break; fi
              sleep 2
            done
            adb shell pidof com.tianbops.zhipei >/dev/null
            sleep 10
            if adb logcat -d -t 5000 | grep -E "FATAL EXCEPTION|Process: com.tianbops.zhipei, PID:"; then
              echo "::error::Android app crashed during emulator startup"
              exit 1
            fi
