name: Android build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew
      - name: Build debug APK (verification only)
        run: cd android && ./gradlew assembleDebug --no-daemon
