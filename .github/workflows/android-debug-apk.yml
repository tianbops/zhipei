name: Android debug APK artifact

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'android-template/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-bridge-contract.mjs'
      - 'scripts/check-template-drift.mjs'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Verify native bridge and template
        run: |
          npm run check:bridge
          npm run check:template-drift
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build installable Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: zhipei-one-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
