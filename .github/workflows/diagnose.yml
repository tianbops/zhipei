name: Diagnose CI

on:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 环境探针
        run: |
          echo "hello from CI"
          node -v
          java -version 2>&1 | head -1 || echo "无 java"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -5 || echo "无 ANDROID_HOME"
